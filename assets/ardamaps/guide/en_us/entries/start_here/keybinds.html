<h2>Exploration</h2>
<p>
    <keybind type="key.ardamaps.open_map"/> Opens the Map<br>
    <keybind type="key.ardamaps.toggle_toposcope"/> Displays the toposcope<br>
    <keybind>G</keybind> Opens the time and weather menu<br>
    <keybind>K</keybind> Toggles shaders<br>
</p>
<h2>Building</h2>
<p>
    <keybind>C</keybind> When holding a block, Conquest Reforged block palette<br>
    <keybind>Ctrl</keybind> + <keybind>middle click</keybind> Selects the block you're looking at 'locked' to its current blockstate<br>
</p>
