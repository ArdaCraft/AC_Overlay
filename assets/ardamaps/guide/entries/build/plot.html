<p>
    To claim a plot, type <chatcommand>/server plots</chatcommand> then <chatcommand>/plot auto</chatcommand><br>
    This will grant you a 200x200 area where you can build whatever you like. You can return any time with <chatcommand>/plot home</chatcommand>.<br>
    If you want to build with someone else, type <chatcommand>/plot add <username/></chatcommand>.
</p>
